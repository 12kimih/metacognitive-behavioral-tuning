[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "metacognitive-behavioral-tuning"
version = "1.0.0"
description = "Metacognitive Behavioral Tuning (MBT): insert metacognitive behaviors into teacher reasoning traces by rewriting (MBT-R), marker-based insertion (MBT-I) or agentic editing (MBT-A)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
e2b = ["e2b>=2.55.1,<2.56"]
test = ["pytest>=8"]

[project.scripts]
mbt = "mbt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
